name: PR security checks

# Runs on every pull request into: main, staging.
# - Dependency review: fails if the PR adds a dependency with a known high or critical vulnerability.
# - Gitleaks: fails if a commit in the PR adds something that looks like a secret.
# - Semgrep: scans with our own Stablezact rules (.semgrep/). Report-only — it never
#   fails the build; findings go to the Security tab. See .semgrep/stablezact.yml.
# Third-party code is pinned to exact commits / checksums so a moved tag cannot change what runs.

on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: pr-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks (pinned version, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
      - name: Scan the commits in this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          FROM=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose \
            --log-opts="${FROM}..${HEAD_SHA}" .

  semgrep:
    name: Semgrep (Stablezact rules, report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
      actions: read            # upload-sarif reads the workflow run to attach results
    env:
      # semgrep/semgrep 1.179.0 (linux/amd64), pinned by digest so a moved tag
      # cannot change what runs. ubuntu-latest runners are amd64.
      # Re-pin with: docker manifest inspect -v semgrep/semgrep:<ver>
      SEMGREP_IMAGE: semgrep/semgrep@sha256:cab19964e6c93019934252a9cd591d9b27df1e5b5d1734b26f4069ae51c295f8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Semgrep with our rules (report-only; never fails the build)
        continue-on-error: true
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan \
              --config .semgrep/ \
              --exclude .semgrep \
              --sarif --output semgrep.sarif \
              --metrics off --disable-version-check
      - name: Ensure a SARIF file exists even if Semgrep produced none
        if: always()
        run: test -f semgrep.sarif || echo '{"version":"2.1.0","runs":[]}' > semgrep.sarif
      - name: Upload results to the Security tab
        if: always()
        continue-on-error: true   # report-only: an upload hiccup must never block a merge
        uses: github/codeql-action/upload-sarif@2a2dd30f8030072d379eb0c9ea51789aa2ea9ca4 # v3.29.5
        with:
          sarif_file: semgrep.sarif
          category: semgrep
