name: OSV-Scanner

# Scans every lockfile against the OSV vulnerability database (a second source alongside
# Dependabot). Report-only: results go to the Security tab under "OSV-Scanner"; it never
# blocks a merge. Dependency review on PRs is what blocks new vulnerable packages.

on:
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/osv-scanner.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --recursive
        ./
      fail-on-vuln: false
