name: Semgrep (branch alerts)

# Records our Semgrep findings as standing Security-tab alerts by running on
# push to the branch that carries the rules (.semgrep/). The PR-time run lives
# in pr-security.yml for inline annotations; this one keeps the Security tab
# populated. Report-only: it never fails the build.

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # upload SARIF to the Security tab
  actions: read            # upload-sarif reads the workflow run to attach results

concurrency:
  group: semgrep-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep (Stablezact rules, report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # semgrep/semgrep 1.179.0 (linux/amd64), pinned by digest.
      SEMGREP_IMAGE: semgrep/semgrep@sha256:cab19964e6c93019934252a9cd591d9b27df1e5b5d1734b26f4069ae51c295f8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Semgrep with our rules (report-only; never fails the build)
        continue-on-error: true
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan \
              --config .semgrep/ \
              --exclude .semgrep \
              --sarif --output semgrep.sarif \
              --metrics off --disable-version-check
      - name: Ensure a SARIF file exists even if Semgrep produced none
        if: always()
        run: test -f semgrep.sarif || echo '{"version":"2.1.0","runs":[]}' > semgrep.sarif
      - name: Upload results to the Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2a2dd30f8030072d379eb0c9ea51789aa2ea9ca4 # v3.29.5
        with:
          sarif_file: semgrep.sarif
          category: semgrep
